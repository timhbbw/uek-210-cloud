---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: devops-backend-route
  labels:
    app: devops-backend
    app.kubernetes.io/part-of: devops
spec:
  to:
    kind: Service
    name: devops-backend-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect