---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: devops-db
  labels:
    app: devops-db
    app.kubernetes.io/part-of: devops
spec:
  selector:
    matchLabels:
      app: devops-db
      tier: database
  template:
    metadata:
      labels:
        app: devops-db
        tier: database
    spec:
      containers:
      - name: postgres
        ports:
            - containerPort: 5432
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: db-user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: db-password
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: db-name
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
          - name: postgres-run
            mountPath: /var/run/postgresql
        image: postgres:18.4
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgresvolume
        - name: postgres-run
          emptyDir: {}