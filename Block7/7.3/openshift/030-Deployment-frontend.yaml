---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: devops-frontend
  labels:
    app: devops-frontend
    app.kubernetes.io/part-of: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-frontend
  template:
    metadata:
      labels:
        app: devops-frontend
    spec:
      containers:
      - name: devops-frontend
        image: ghcr.io/timhbbw/devops-frontend:v1
        env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: BACKEND_URL
            value: 'https://devops-backend-route-$(NAMESPACE).apps.exoscale-ch-gva-2-0.appuio.cloud'
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            memory: 1Gi
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
            protocol: TCP