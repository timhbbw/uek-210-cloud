apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quotes-backend
  labels:
    app: quotes-backend
    app.kubernetes.io/part-of: quotes-backend
spec:
  port:
    targetPort: 10000-tcp
  to:
    kind: Service
    name: quotes-backend
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
