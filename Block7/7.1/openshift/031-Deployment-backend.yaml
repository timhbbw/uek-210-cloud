kind: Deployment
apiVersion: apps/v1
metadata:
  name: quotes-backend
  labels:
    app: quotes-backend
    app.kubernetes.io/part-of: quotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quotes-backend
  template:
    metadata:
      labels:
        app: quotes-backend
    spec:
      containers:
        - name: quotes-backend
          image: quay.io/donschenck/quotes:v2
          env:
            - name: DB_SERVICE_NAME
              value: quotesdb
          resources:
            limits:
              memory: 300Mi
            requests:
              memory: 200Mi
          imagePullPolicy: Always
          ports:
            - containerPort: 10000
              protocol: TCP
