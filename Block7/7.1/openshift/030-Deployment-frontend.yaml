---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: quotes-frontend
  labels:
    app: quotes-frontend
    app.kubernetes.io/part-of: quotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quotes-frontend
  template:
    metadata:
      labels:
        app: quotes-frontend
    spec:
      containers:
        - name: quotes-frontend
          image: ghcr.io/timhbbw/quotes-frontend:v1
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
